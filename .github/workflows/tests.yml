name: UI tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    steps:
      # 1. Download the code onto the runner
      - uses: actions/checkout@v4

      # 2. Install .NET on the runner
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 3. Compile the project
      - name: Build
        run: dotnet build -c Release

      # 4. Install the Chromium browser that Playwright controls
      - name: Install browser
        run: pwsh tests/SauceDemo.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # 5. Run the tests (the logger adds the pass/fail summary on the run page)
      - name: Run tests
        run: dotnet test -c Release --no-build --logger GitHubActions

      # 6. Only if something failed: save the screenshots so you can download them
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: tests/SauceDemo.Tests/bin/Release/net10.0/screenshots
          if-no-files-found: ignore